<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#0d1b2a"/>
      <stop offset="100%" stop-color="#1b263b"/>
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>

    <linearGradient id="purple-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f093fb"/>
      <stop offset="100%" stop-color="#f5576c"/>
    </linearGradient>

    <linearGradient id="ebpf-orange" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff9900"/>
      <stop offset="100%" stop-color="#ff5e62"/>
    </linearGradient>

    <!-- Glowing Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      .title-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        font-size: 42px;
        fill: #ffffff;
        letter-spacing: -0.5px;
      }
      .subtitle-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-weight: 500;
        font-size: 19px;
        fill: #94a3b8;
      }
      .pill-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-weight: 600;
        font-size: 13px;
        fill: #e2e8f0;
      }
      /* Animated data packets */
      @keyframes flowPacket1 {
        0% { cx: 80px; cy: 120px; opacity: 0; }
        20% { opacity: 0.9; }
        80% { opacity: 0.9; }
        100% { cx: 1120px; cy: 80px; opacity: 0; }
      }
      @keyframes flowPacket2 {
        0% { cx: 1100px; cy: 260px; opacity: 0; }
        20% { opacity: 0.8; }
        80% { opacity: 0.8; }
        100% { cx: 120px; cy: 220px; opacity: 0; }
      }
      @keyframes flowPacket3 {
        0% { cx: 200px; cy: 50px; opacity: 0; }
        50% { opacity: 1; }
        100% { cx: 1050px; cy: 290px; opacity: 0; }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.25; transform: scale(1); }
        50% { opacity: 0.45; transform: scale(1.08); }
      }
      @keyframes orbitRing {
        0% { stroke-dashoffset: 0; }
        100% { stroke-dashoffset: 360; }
      }
      .animated-packet1 {
        animation: flowPacket1 8s infinite linear;
      }
      .animated-packet2 {
        animation: flowPacket2 11s infinite linear;
      }
      .animated-packet3 {
        animation: flowPacket3 9s infinite linear;
      }
      .glow-orb {
        transform-origin: 980px 170px;
        animation: pulseGlow 5s infinite ease-in-out;
      }
      .ring-anim {
        stroke-dasharray: 20 12;
        animation: orbitRing 25s infinite linear;
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="340" rx="16" fill="url(#bg-grad)" />

  <!-- Background Circuit & Network Grid Lines -->
  <g opacity="0.12" stroke="#38bdf8" stroke-width="1.2">
    <line x1="0" y1="68" x2="1200" y2="68" />
    <line x1="0" y1="136" x2="1200" y2="136" />
    <line x1="0" y1="204" x2="1200" y2="204" />
    <line x1="0" y1="272" x2="1200" y2="272" />
    <line x1="150" y1="0" x2="150" y2="340" />
    <line x1="300" y1="0" x2="300" y2="340" />
    <line x1="450" y1="0" x2="450" y2="340" />
    <line x1="600" y1="0" x2="600" y2="340" />
    <line x1="750" y1="0" x2="750" y2="340" />
    <line x1="900" y1="0" x2="900" y2="340" />
    <line x1="1050" y1="0" x2="1050" y2="340" />
  </g>

  <!-- Dynamic Glowing Background Network / Constellation (in background) -->
  <g opacity="0.35">
    <!-- Ambient glow orbs in right corner -->
    <circle class="glow-orb" cx="1020" cy="170" r="130" fill="#00f2fe" filter="url(#glow)" />
    <circle class="glow-orb" cx="930" cy="140" r="90" fill="#f093fb" filter="url(#glow)" style="animation-delay: -2.5s;" />

    <!-- Network connection paths in background -->
    <path d="M 80 120 L 350 90 L 680 140 L 920 80 L 1120 80" fill="none" stroke="#00f2fe" stroke-width="1.8" opacity="0.4" />
    <path d="M 120 220 L 400 240 L 720 190 L 980 250 L 1100 260" fill="none" stroke="#f093fb" stroke-width="1.8" opacity="0.4" />
    <path d="M 200 50 L 520 180 L 820 230 L 1050 290" fill="none" stroke="#ff9900" stroke-width="1.8" opacity="0.35" />

    <!-- Rotating tech rings (right side visual) -->
    <circle cx="1000" cy="170" r="75" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.45" class="ring-anim" />
    <circle cx="1000" cy="170" r="105" fill="none" stroke="#c084fc" stroke-width="1.5" opacity="0.3" class="ring-anim" style="animation-direction: reverse; animation-duration: 35s;" />
  </g>

  <!-- Animated Data Packets (Flying across networking highways) -->
  <circle class="animated-packet1" cx="80" cy="120" r="5" fill="#00f2fe" filter="url(#glow)" />
  <circle class="animated-packet2" cx="1100" cy="260" r="4.5" fill="#f093fb" filter="url(#glow)" />
  <circle class="animated-packet3" cx="200" cy="50" r="4" fill="#ffb703" filter="url(#glow)" />

  <!-- Constellation Nodes (background points) -->
  <g fill="#38bdf8" opacity="0.6">
    <circle cx="350" cy="90" r="3" />
    <circle cx="680" cy="140" r="3" />
    <circle cx="920" cy="80" r="3.5" />
    <circle cx="400" cy="240" r="3" />
    <circle cx="720" cy="190" r="3" />
    <circle cx="980" cy="250" r="3.5" />
  </g>

  <!-- Foreground Content (Solid, Clear, Never obscured) -->
  <g transform="translate(60, 0)">
    <!-- Category Pill Badge -->
    <g transform="translate(0, 52)">
      <rect width="320" height="30" rx="15" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" opacity="0.95" />
      <circle cx="16" cy="15" r="5" fill="#00f2fe" />
      <text x="32" y="20" class="pill-text" fill="#38bdf8">⚡ CLOUD-NATIVE &amp; EBPF ECOSYSTEM</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="132" class="title-text">
      Cloud-Native Networking &amp; eBPF
    </text>

    <!-- Subtitle / Mission Statement -->
    <text x="0" y="172" class="subtitle-text">
      The definitive curated index of CNIs, kernel dataplanes, network policies &amp; observability
    </text>

    <!-- Feature Pills / Highlights -->
    <g transform="translate(0, 212)">
      <!-- Pill 1 -->
      <g transform="translate(0, 0)">
        <rect width="170" height="36" rx="18" fill="#1e293b" stroke="#475569" stroke-width="1" />
        <text x="22" y="23" class="pill-text">🚀 eBPF Dataplanes</text>
      </g>
      <!-- Pill 2 -->
      <g transform="translate(182, 0)">
        <rect width="180" height="36" rx="18" fill="#1e293b" stroke="#475569" stroke-width="1" />
        <text x="20" y="23" class="pill-text">🛡️ Kubernetes CNIs</text>
      </g>
      <!-- Pill 3 -->
      <g transform="translate(374, 0)">
        <rect width="170" height="36" rx="18" fill="#1e293b" stroke="#475569" stroke-width="1" />
        <text x="20" y="23" class="pill-text">📊 Deep Observability</text>
      </g>
      <!-- Pill 4 -->
      <g transform="translate(556, 0)">
        <rect width="170" height="36" rx="18" fill="#1e293b" stroke="#475569" stroke-width="1" />
        <text x="22" y="23" class="pill-text">🔒 Zero-Trust Policies</text>
      </g>
    </g>

    <!-- Bottom Metadata Line -->
    <text x="0" y="286" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#64748b">
      CURATED SAAS &amp; OPEN-SOURCE DIRECTORY • COMMUNITY MAINTAINED • UPDATED 2026
    </text>
  </g>
</svg>
